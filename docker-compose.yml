# Manifeste pour Aiven Runtime (Deploy application > Scan).
# Les secrets (DATABASE_URL, ANTHROPIC_API_KEY, Kafka) se renseignent dans la config de l'app Aiven, pas dans ce fichier.
services:
  launchpilot:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
